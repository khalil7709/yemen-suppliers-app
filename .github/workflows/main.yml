name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate missing Android files
        run: flutter create --platforms=android --project-name=yemen_suppliers_app .

      - name: Copy Firebase Config
        run: cp google-services.json android/app/

      - name: Patch app build.gradle
        run: |
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/build.gradle
          sed -i "s/classpath 'com.android.tools.build:gradle:.*'/classpath 'com.android.tools.build:gradle:8.1.0'\n        classpath 'com.google.gms:google-services:4.4.0'/" android/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-suppliers-apk
          path: build/app/outputs/flutter-apk/app-release.apk
